<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/docs.css' | relative_url }}">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #2d2d2d;
            background-color: #ffffff;
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }
        h1, h2, h3, h4, h5, h6 {
            color: #000000;
            font-weight: 600;
            margin-top: 2rem;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 2.5rem;
            border-bottom: 3px solid #000000;
            padding-bottom: 0.5rem;
        }
        h2 {
            font-size: 2rem;
            border-bottom: 2px solid #cccccc;
            padding-bottom: 0.3rem;
        }
        a {
            color: #000000;
            text-decoration: underline;
        }
        a:hover {
            color: #666666;
        }
        code {
            background-color: #f5f5f5;
            border: 1px solid #e6e6e6;
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-family: monospace;
            font-size: 0.9em;
        }
        pre {
            background-color: #f5f5f5;
            border: 1px solid #cccccc;
            border-radius: 4px;
            padding: 1rem;
            overflow-x: auto;
        }
        pre code {
            background: none;
            border: none;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 1.5rem 0;
        }
        th, td {
            border: 1px solid #cccccc;
            padding: 0.75rem;
            text-align: left;
        }
        th {
            background-color: #000000;
            color: #ffffff;
            font-weight: 600;
        }
        tr:nth-child(even) {
            background-color: #f5f5f5;
        }
        blockquote {
            border-left: 4px solid #000000;
            margin: 1.5rem 0;
            padding: 1rem 1rem 1rem 1.5rem;
            color: #666666;
            background-color: #f5f5f5;
        }
        .home-link {
            display: inline-block;
            background-color: #000000;
            color: #ffffff;
            padding: 0.5rem 1rem;
            text-decoration: none;
            border-radius: 4px;
            margin-bottom: 2rem;
        }
        .home-link:hover {
            background-color: #404040;
        }
        hr {
            border: none;
            border-top: 2px solid #cccccc;
            margin: 2rem 0;
        }
    </style>
</head>
<body>
    <a href="{{ site.baseurl }}/" class="home-link">← Back to Home</a>

    <main>
        {{ content }}
    </main>

    <hr>
    <footer style="text-align: center; color: #666666; margin-top: 2rem;">
        <p>&copy; 2025 Vinay Thakur | <a href="mailto:vpst18@gmail.com">vpst18@gmail.com</a></p>
        <p><a href="{{ site.baseurl }}/">Measurement Scales Reference Guide</a></p>
    </footer>
</body>
</html>
